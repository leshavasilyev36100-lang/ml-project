data:
  n_samples: 2000
  n_features: 10
  n_informative: 6
  random_state: 42
  test_size: 0.2
  raw_path: "data/raw/dataset.csv"
  train_path: "data/processed/train.csv"
  test_path: "data/processed/test.csv"

train:
  random_state: 42
  n_estimators: 100
  learning_rate: 0.1
  max_depth: 3
  model_path: "models/gradient_boosting.joblib"
  metrics_path: "outputs/metrics.json"

predict:
  input_path: "data/processed/test.csv"
  predictions_path: "outputs/predictions.csv"
